# Características del producto: determinan qué entregables condicionales son obligatorios (catalog/phases.yaml).
features:
  has_ui: true
  has_api: false
  has_persistent_data: true
  uses_ai_in_product: false

# Clasificación más alta de los datos que maneja el producto (catalog/data-classification.yaml).
# RESTRICTED: el producto guarda contraseñas de terceros. Se cifran en el navegador (zero-knowledge):
# el servidor solo recibe texto cifrado. Desarrollo y pruebas usan exclusivamente credenciales ficticias.
data_classification_max: RESTRICTED

# Proveedores de IA concretos y el tipo de destino que representan.
providers: []
#  - name: <proveedor>
#    destination_type: enterprise_llm

# Agentes habilitados; `capabilities` son los permisos concedidos.
agents: []
#  - agent_id: <id>
#    type: DEVELOPER
#    provider: <proveedor>
#    tool: <herramienta>
#    capabilities: [analysis, code_modification, test_generation, test_execution, git_read, commit]
#    max_autonomy_level: 3

# Comando que verifica cada gate; `ai-dev task complete` los ejecuta. Sin comando, la verificación es manual.
gate_commands: {}
#  CODE: npm run lint
#  BUILD: npm run build
#  TEST: npm test
#  SECURITY: npm audit --audit-level=high

# Adaptadores de asistentes de IA que se generan (`ai-dev adapters sync`). agents-md siempre se incluye.
adapters: [agents-md, claude-code, cursor, copilot, gemini]

environments: [local, production]
