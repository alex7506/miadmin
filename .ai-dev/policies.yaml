# Todas las políticas de agents/policies/agent-policies.yaml están siempre activas.
# Aquí solo se añaden políticas propias, más restrictivas.
local_policies:
  - id: local_no_plaintext_secrets_stored
    severity: BLOCKING
    description: Las contraseñas de la bóveda se cifran en el navegador con la clave maestra; nunca se guardan, registran ni transmiten en claro.
    extends: data_classification_respected
  - id: local_fake_credentials_only
    severity: BLOCKING
    description: En desarrollo, pruebas, evidencia y conversaciones con agentes solo se usan credenciales ficticias; nunca credenciales reales.
    extends: no_secrets
